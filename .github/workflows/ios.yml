name: iOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned device app
        run: xcodebuild -project ChromaticCamera.xcodeproj -scheme ChromaticCamera -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Package unsigned IPA
        shell: bash
        run: |
          test -f build/Build/Products/Release-iphoneos/ChromaticCamera.app/ChromaticCamera
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/ChromaticCamera.app ipa/Payload/
          (cd ipa && zip -r ../ChromaticCamera-unsigned.ipa Payload)
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChromaticCamera-unsigned-ipa
          path: ChromaticCamera-unsigned.ipa

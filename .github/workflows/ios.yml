name: iOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: xcodebuild -project ChromaticCamera.xcodeproj -scheme ChromaticCamera -sdk iphonesimulator -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 15' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ChromaticCamera-simulator
          path: build/Build/Products/Debug-iphonesimulator/ChromaticCamera.app
